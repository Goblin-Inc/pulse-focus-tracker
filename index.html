<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE // Quantum Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <div class="logo">PULSE<span>.v2</span></div>
        <nav>
            <a href="index.html" class="nav-link active">Терминал</a>
            <a href="logs.html" class="nav-link">Архив логов</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="status-badge">Система активна</div>
            <h1>Синхронизация <br><span class="gradient-text">ментального ядра</span></h1>
            <p class="subtitle">Запустите сканирование, чтобы зафиксировать текущий индекс фокуса и сохранить его в квантовую базу данных локального узла.</p>
            
            <div class="interactive-panel">
                <div class="metric">
                    <span class="label">Индекс фокуса</span>
                    <span id="focus-index" class="value">00%</span>
                </div>
                <button id="action-btn" class="cyber-btn">Запустить симуляцию</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
